<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfcfd">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script>
        (function () {
            const root = document.documentElement;
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            let savedTheme = null;

            try {
                savedTheme = localStorage.getItem('theme');
            } catch (error) {
                savedTheme = null;
            }

            const theme = savedTheme || (systemDark ? 'dark' : 'light');
            root.dataset.theme = theme;
            root.style.colorScheme = theme;
            document.querySelector('meta[name="theme-color"]')
                .setAttribute('content', theme === 'dark' ? '#0b0b10' : '#fcfcfd');
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
            Percival<span aria-hidden="true">.</span>
        </a>

        <nav class="site-nav" aria-label="主导航">
            <a class="site-nav__link{% if page.url == '/archive/' or page.layout == 'post' %} is-active{% endif %}"
               href="{{ '/archive/' | relative_url }}">文章</a>
            <a class="site-nav__link{% if page.url == '/about/' %} is-active{% endif %}"
               href="{{ '/about/' | relative_url }}">关于</a>
            <a class="site-nav__link" href="https://github.com/percival-06"
               target="_blank" rel="noopener noreferrer">GitHub</a>
            <button class="theme-toggle" id="theme-toggle" type="button"
                    aria-label="切换深浅色主题" title="切换深浅色主题">
                <span class="theme-icon theme-icon--light" aria-hidden="true">☀</span>
                <span class="theme-icon theme-icon--dark" aria-hidden="true">☾</span>
            </button>
        </nav>
    </header>

    <main class="site-main">
        {{ content }}
    </main>

    <script>
        (function () {
            const root = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const themeColor = document.querySelector('meta[name="theme-color"]');

            function applyTheme(theme, remember) {
                root.dataset.theme = theme;
                root.style.colorScheme = theme;
                themeColor.setAttribute('content', theme === 'dark' ? '#0b0b10' : '#fcfcfd');
                toggle.setAttribute('aria-pressed', String(theme === 'dark'));

                if (remember) {
                    try {
                        localStorage.setItem('theme', theme);
                    } catch (error) {
                        // The selected theme still applies when storage is unavailable.
                    }
                }
            }

            applyTheme(root.dataset.theme || 'light', false);
            toggle.addEventListener('click', function () {
                applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', true);
            });
        })();
    </script>
</body>
</html>
